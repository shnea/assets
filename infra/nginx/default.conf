server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s;
    set $assets_api api:8080;
    set $assets_web web:80;
    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data: ${PLATFORM_IMAGE_ORIGIN}; media-src 'self' ${PLATFORM_IMAGE_ORIGIN}; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://platform.shnea.kr" always;
    location = /api/backup/import {
        # Originals are streamed to the platform, with the member's quota checked in the API.
        client_max_body_size 0;
        proxy_pass http://$assets_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        access_log off;
    }
    location ~ ^/(api|mcp|oauth2)(/|$) {
        proxy_pass http://$assets_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        access_log off;
    }
    location = /callback {
        proxy_pass http://$assets_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    location / { proxy_pass http://$assets_web; }
}
