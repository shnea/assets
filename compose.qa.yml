# Isolated verification only. Never use this override for a deployed service.
name: assets-qa
services:
  identity:
    image: node:24-alpine
    working_dir: /app
    command: [node, fixture.mjs]
    volumes:
      - ./qa/fixture.mjs:/app/fixture.mjs:ro
    ports:
      - 127.0.0.1:30172:8080
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/.well-known/openid-configuration]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    environment:
      APP_URL: http://localhost:30171
      PLATFORM_URL: http://identity:8080
      PLATFORM_PUBLIC_URL: http://localhost:30172
      PLATFORM_OIDC_ISSUER: http://identity:8080
      PLATFORM_OIDC_REDIRECT_URI: http://localhost:30171/callback
      PLATFORM_API_KEY: qa-key
      PLATFORM_PROJECT_ID: 00000000-0000-0000-0000-000000000001
      PLATFORM_ENVIRONMENT_ID: 00000000-0000-0000-0000-000000000002
      ADMIN_OIDC_ISSUER: http://identity:8080
      ADMIN_OIDC_SUBJECT: admin
      SERVER_SERVLET_SESSION_COOKIE_NAME: ASSETS_QA_SESSION
      COOKIE_SECURE: "false"
    depends_on:
      identity:
        condition: service_healthy
  nginx:
    environment:
      PLATFORM_IMAGE_ORIGIN: http://localhost:30172
    ports: !override
      - 127.0.0.1:30171:8080
